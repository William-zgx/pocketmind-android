name: Android Verification

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  verify:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify
        run: scripts/verify_local.sh

  model-provenance:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify model provenance
        run: VERIFY_MODEL_URLS=1 scripts/verify_local.sh

  emulator-regression:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: macos-14
    timeout-minutes: 75

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK emulator packages
        run: |
          sdkmanager \
            "cmdline-tools;latest" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "emulator" \
            "system-images;android-36;google_apis;arm64-v8a"

      - name: Create API 36 arm64 AVD
        run: |
          echo "no" | avdmanager create avd \
            --force \
            --name pocketmind_ci_api36_arm64 \
            --package "system-images;android-36;google_apis;arm64-v8a"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run connected emulator regression
        run: |
          AVD_NAME=pocketmind_ci_api36_arm64 \
          EMULATOR_SELECT_TIMEOUT_SECONDS=180 \
          BOOT_TIMEOUT_SECONDS=600 \
          ARTIFACT_DIR=build/verification/ci-emulator-regression \
          scripts/regression_emulator.sh

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-regression-evidence
          path: |
            build/verification/ci-emulator-regression
            build/verification/ci-emulator-regression-emulator.log
